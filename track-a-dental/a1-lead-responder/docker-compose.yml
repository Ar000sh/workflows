# Local dev services for A1. Start with: docker compose up -d postgres mailpit
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: leads
      POSTGRES_DB: leads
    ports:
      - "5433:5432"   # 5433 on the host: 5432 is often taken on Windows
    volumes:
      - pgdata:/var/lib/postgresql/data
      # *.sql files here run once, on first start of an empty volume (creates leads_test).
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP: the app "sends" mail here, nothing leaves the machine
      - "8025:8025"   # web UI to read the mails

volumes:
  pgdata:
